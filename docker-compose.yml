name: openaudiolab

# Core control-plane profile (CONTAINER_RUNTIME_PLAN.md). GPU engine/training
# services arrive in milestones 2-3 as separate profiles (test, ace, training).
# Usage: docker compose --profile core up --build

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["core"]
    environment:
      POSTGRES_DB: oal
      POSTGRES_USER: oal
      POSTGRES_PASSWORD: ${OAL_POSTGRES_PASSWORD:?set OAL_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oal -d oal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["core"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible store for standalone deployment. Not consumed by the API
  # until milestone 2 (artifact upload/finalization). quay.io anonymous pulls
  # can hit rate limits; use `docker login quay.io` or a mirror if pull fails.
  object-storage:
    image: quay.io/minio/minio:latest
    profiles: ["storage"]
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OAL_OBJECT_ACCESS_KEY:?set OAL_OBJECT_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${OAL_OBJECT_SECRET_KEY:?set OAL_OBJECT_SECRET_KEY in .env}
    volumes:
      - object-storage-data:/data

  migrate:
    build: .
    profiles: ["core"]
    command: alembic upgrade head
    environment:
      OAL_DATABASE_URL: postgresql+psycopg2://oal:${OAL_POSTGRES_PASSWORD}@postgres:5432/oal
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    profiles: ["core"]
    ports:
      - "50555:50555"
    environment:
      OAL_DATABASE_URL: postgresql+psycopg2://oal:${OAL_POSTGRES_PASSWORD}@postgres:5432/oal
      OAL_CORS_ORIGINS: ${OAL_CORS_ORIGINS:-http://localhost:3000}
      OAL_BIND_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Milestone 2 adds the deterministic WAV fixture worker on this service.
  fixture-worker:
    build: .
    profiles: ["test"]
    command: python -c "print('fixture worker arrives in milestone 2')"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  object-storage-data:
