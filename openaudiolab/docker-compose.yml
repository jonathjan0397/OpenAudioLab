services:
  # ── Infrastructure ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openaudiolab
      POSTGRES_PASSWORD: openaudiolab
      POSTGRES_DB: openaudiolab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openaudiolab"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: openaudiolab
      MINIO_ROOT_PASSWORD: openaudiolab-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 openaudiolab openaudiolab-secret;
      mc mb --ignore-existing local/openaudiolab-jobs;
      exit 0;
      "

  # ── Backend (Orchestration Only) ────────────────────────────────
  # Handles: auth, setup, job queue, storage, dispatch, downloads
  # Does NOT run generation pipeline
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://openaudiolab:openaudiolab@postgres:5432/openaudiolab
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-before-production}
      JWT_SECRET: ${JWT_SECRET:-change-this-before-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/data/openaudiolab/storage}
      DEFAULT_RETENTION_DAYS: ${DEFAULT_RETENTION_DAYS:-7}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-openaudiolab}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-openaudiolab-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-openaudiolab-jobs}
      AGENT_REGISTRATION_TOKEN: ${AGENT_REGISTRATION_TOKEN:-change-this-agent-token}
      ENABLE_CPU_TEST_GENERATION: ${ENABLE_CPU_TEST_GENERATION:-true}
      CPU_TEST_MAX_DURATION_SECONDS: ${CPU_TEST_MAX_DURATION_SECONDS:-15}
      SEED_DEV_ADMIN: ${SEED_DEV_ADMIN:-false}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      VASTAI_API_KEY: ${VASTAI_API_KEY:-}
      ENABLE_CLOUD_AGENTS: ${ENABLE_CLOUD_AGENTS:-false}
    volumes:
      - local_storage:/data/openaudiolab/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── Frontend (UI Only) ──────────────────────────────────────────
  # Completely separate from agent. Only talks to backend API.
  # Can be deployed on any machine, independently of backend or agent.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://backend:8000
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

  # ── Agent Framework (Generation Pipeline) ───────────────────────
  # Runs ALL generation stages: lyrics, composition, audio, effects, mastering, stems
  # Returns artifacts to backend. Backend handles storage.
  # Can run on same machine as backend, or on remote GPU (RunPod, Vast.ai).
  agent-lite:
    build:
      context: ./agent
      dockerfile: Dockerfile.lite
    environment:
      BACKEND_URL: http://backend:8000
      AGENT_REGISTRATION_TOKEN: ${AGENT_REGISTRATION_TOKEN:-change-this-agent-token}
      AGENT_NAME: local-test-agent
      AGENT_MODE: lite
      MODEL_PACK_PATH: /app/model-packs/model-pack-lite.json
      AGENT_VERSION: ${AGENT_VERSION:-0.1.0}
      ENABLE_CPU_TEST_GENERATION: ${ENABLE_CPU_TEST_GENERATION:-true}
      CPU_TEST_MAX_DURATION_SECONDS: ${CPU_TEST_MAX_DURATION_SECONDS:-15}
    volumes:
      - local_storage:/data/openaudiolab/storage
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  local_storage:
